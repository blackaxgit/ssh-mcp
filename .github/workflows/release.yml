name: Release

# The tag is the release input. `v*` only — the guard step in `build` asserts the
# tag matches the version hatchling reads out of src/ssh_mcp/__init__.py, so a
# mistyped tag fails before anything is published.
on:
  push:
    tags:
      - "v*"

# Least privilege by default; every job re-grants exactly what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel a half-finished publish

jobs:
  # ---------------------------------------------------------------------------
  # Gates. These duplicate ci.yml deliberately: ci.yml runs on branches, not on
  # tags, so without these a tag could be cut from a commit that never passed CI
  # (or that passed CI days ago, before a new advisory landed). `audit` in
  # particular MUST run at tag time — its input is the live advisory DB.
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: uv run python -m pytest tests/ -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --extra dev
      - run: uv run ruff format --check src/ tests/
      - run: uv run ruff check src/ tests/
      - run: uv run mypy src/
      - run: uv run bandit -r src/ -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          version: "0.11.32"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked --extra dev
      - run: uv run pip-audit

  # ---------------------------------------------------------------------------
  # Build. Runs with contents:read ONLY — it must never hold id-token:write.
  # Keeping build and publish in separate jobs is what stops a poisoned build
  # cache from reaching the credential-bearing job.
  # ---------------------------------------------------------------------------
  build:
    name: Build sdist + wheel
    needs: [test, lint, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - run: uv python install 3.13

      # hatchling reads the version from src/ssh_mcp/__init__.py. If the tag and
      # that string disagree, the artifact filename will not match the tag and
      # the release is a lie. Fail here, not after upload — PyPI uploads are
      # irreversible and, since 2026-07-08, un-amendable after 14 days.
      - name: Assert tag matches package version
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(uv run python -c "import ssh_mcp; print(ssh_mcp.__version__)")"
          if [ "${GIT_TAG}" != "v${PKG_VERSION}" ]; then
            echo "::error::tag ${GIT_TAG} != package version v${PKG_VERSION}" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      # Smoke-test the built artifacts, not the source tree. Catches a wheel
      # that is missing a module or an entry point.
      - name: Smoke test (wheel)
        run: uv run --isolated --no-project --with dist/*.whl -- ssh-mcp --help
      - name: Smoke test (sdist)
        run: uv run --isolated --no-project --with dist/*.tar.gz -- ssh-mcp --help

      # CycloneDX SBOM of the LOCKED RUNTIME dependency set (no dev extras).
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          mkdir -p dist-sbom
          uv export --no-dev --no-emit-project \
            --format cyclonedx1.5 \
            --output-file "dist-sbom/ssh-mcp-${{ github.ref_name }}.cdx.json"
        continue-on-error: false

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: dist-sbom/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish. The ONLY job with id-token: write. Runs in the `pypi` environment,
  # which is where the human approval gate lives and which PyPI's trusted
  # publisher config pins to. Nothing is built here.
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ssh-mcp
    permissions:
      id-token: write   # mandatory for Trusted Publishing AND for PEP 740 attestations
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      # No `user:`/`password:` — Trusted Publishing supplies a short-lived OIDC
      # token. `attestations:` is intentionally NOT set: it defaults to true
      # since v1.11.0, and setting it explicitly invites someone to "simplify"
      # it to false later.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1

  # ---------------------------------------------------------------------------
  # GitHub Release: attach the SBOM + the exact artifacts that went to PyPI, and
  # a GitHub-native build provenance attestation over them.
  # ---------------------------------------------------------------------------
  github-release:
    name: GitHub Release
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
      id-token: write        # sign the attestation
      attestations: write    # record it
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom
          path: dist-sbom/

      - name: Attest build provenance for the distributions
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: "dist/*"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${GIT_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GIT_TAG}" \
            --generate-notes \
            dist/* dist-sbom/*
