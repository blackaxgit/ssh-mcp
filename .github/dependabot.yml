version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR per batch. Three separate single-package security PRs is why
      # #54 and #55 were red: each cleared one advisory while pip-audit
      # still saw the others, so the `audit` gate failed on every one.
      python-security:
        applies-to: security-updates
        patterns: ["*"]
      python-version-updates:
        applies-to: version-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
