[project]
# PyPI distribution name. NOT "ssh-mcp": that name on PyPI belongs to an
# unrelated project (author czyhandsome, MIT, last released 0.1.4 in June 2025)
# and this project has never owned it. Until 0.6.1 the docs told users to run
# `uvx ssh-mcp` / `pip install ssh-mcp`, which installed that stranger's
# package — also an SSH tool, so the substitution was not obvious. Do not
# "restore" this to "ssh-mcp"; the upload would be rejected and the docs would
# again point at someone else's code. The import package stays `ssh_mcp` and the
# container image stays ghcr.io/blackaxgit/ssh-mcp.
name = "blc-ssh-mcp"
dynamic = ["version"]
description = "MCP server giving AI assistants SSH access to run commands, transfer files, and manage server fleets"
# Without `readme` there is NO long description in the wheel METADATA, and the
# PyPI project page renders an empty body — which is exactly what 0.6.1 shipped.
# The README is written to survive being rendered off-GitHub: every link in it
# is absolute, because PyPI resolves relative links against pypi.org and they
# would 404. Keep it that way when editing README.md.
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 SPDX expression, not the legacy `{text = "..."}` table (deprecated,
# and setuptools/hatchling both warn on it). `license-files` replaces the
# `License :: OSI Approved ::` classifier, which PEP 639 also deprecates — do
# not add that classifier back alongside this.
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "SSH MCP Contributors"},
]
keywords = ["mcp", "ssh", "claude", "infrastructure", "sftp", "devops", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # v1.x entered maintenance mode — security fixes only — at the v2.0.0
    # release, so 2.x is the supported line. The old floor was 1.28.1, for
    # PYSEC-2026-3481 (CVE-2026-52870), PYSEC-2026-3482 (CVE-2026-52869) and
    # PYSEC-2026-3483 (CVE-2026-59950); 2.x is far above all three. This
    # floor lands in the published wheel METADATA and is the only thing
    # protecting `pip install blc-ssh-mcp` consumers — uv.lock does not.
    #
    # The `[cli]` extra is deliberately NOT requested: ssh-mcp parses
    # sys.argv directly (server.py::main) and never imports mcp.cli, typer,
    # click or python-dotenv. Dropping it removes three packages from the
    # published dependency closure. `click` still arrives via uvicorn, so its
    # security floor in [tool.uv] stays load-bearing.
    "mcp>=2.1.1,<3.0.0",
    # 2.24.0, not 2.23.1: 2.23.1 fixed CVE-2026-54591 (GHSA-2wxc-x7rj-hg8f,
    # SCP client path traversal to arbitrary file write via server-supplied
    # filenames) and CVE-2026-54590 (GHSA-qr67-gv47-xwwh, incomplete fix for
    # CVE-2026-45309 — AuthorizedKeysFile %u still escaped via a leading ~).
    # 2.24.0 (2026-06-27) postdates 2.23.1 (2026-06-07) and is a clean
    # superset. Neither CVE is reachable here: ssh-mcp uses SFTP and never
    # asyncssh.scp, and it is a client, not a server. The floor still matters
    # because it lands in the published wheel METADATA and is the only thing
    # protecting `pip install blc-ssh-mcp` consumers — uv.lock does not.
    "asyncssh>=2.24.0,<3.0.0",
    # structlog uses CalVer, so the major cap is the next YEAR, not 26.
    "structlog>=26.1.0,<27.0.0",
    "orjson>=3.12.0,<4.0.0",
    # mcp>=2 requires pydantic>=2.12.0. Matching that floor here keeps the
    # wheel metadata honest instead of relying on mcp to carry it for us.
    "pydantic>=2.12.0,<3.0.0",
]

[project.scripts]
# `blc-ssh-mcp` must exist and match the distribution name, or `uvx blc-ssh-mcp`
# finds no console script of that name and fails. `ssh-mcp` is kept as an alias:
# the Dockerfile HEALTHCHECK and release.yml's smoke test both invoke it, and
# existing installs have it on PATH.
blc-ssh-mcp = "ssh_mcp.server:main"
ssh-mcp = "ssh_mcp.server:main"

[project.urls]
Homepage = "https://github.com/blackaxgit/ssh-mcp"
Repository = "https://github.com/blackaxgit/ssh-mcp"
Issues = "https://github.com/blackaxgit/ssh-mcp/issues"
Changelog = "https://github.com/blackaxgit/ssh-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/blackaxgit/ssh-mcp#readme"
"Security Policy" = "https://github.com/blackaxgit/ssh-mcp/blob/main/SECURITY.md"
"Container Image" = "https://github.com/blackaxgit/ssh-mcp/pkgs/container/ssh-mcp"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    # Patched pip in the dev/CI venv: PYSEC-2026-196 and CVE-2026-13346
    # (GHSA-qwm4-qh6w-59xr — doubly-encoded package URLs from an index could
    # install files to arbitrary paths; materially affects
    # `pip download --only-binary`). Not a runtime dependency.
    "pip>=26.2.1",
    "hypothesis>=6.167.1,<7.0.0",
    # OTel SDK is needed at test time for the in-memory exporter. The API
    # half is no longer declared anywhere: mcp>=2 requires it outright.
    "opentelemetry-sdk>=1.44.0,<2.0.0",
    # Lint tooling is PINNED and resolved from this locked dev environment,
    # never via `uvx` (which floats to the newest release at run time). On
    # 2026-07-23 ruff 0.16.0 expanded its default rule set from 59 to 413
    # rules, so `uvx ruff check` began failing CI on commits it had passed a
    # week earlier. A CI gate must be a function of the commit under review,
    # not of what the tool happens to ship today. Bump these deliberately.
    "ruff==0.16.6",
    "bandit==1.9.4",
    # Used by tests/test_ci_lint_determinism.py to parse the workflow files.
    # bandit already pulls PyYAML in transitively; declared explicitly here so
    # the test suite does not depend on another package's dependency tree.
    "pyyaml>=6.0.3",
    # Used by tests/test_dependency_floors.py. Previously present only
    # transitively, which made the floor tests quietly env-dependent. The
    # floor is low on purpose — nothing here needs a recent packaging.
    "packaging>=25.0",
]
# There is deliberately no `otel` extra. It existed to install
# opentelemetry-api without the SDK, but mcp>=2 requires opentelemetry-api
# outright, so the extra became a no-op. Spans are always created; with no
# SDK and no exporter installed they are no-ops that record nothing, which is
# the same operator experience the extra used to describe.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ssh_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
# REQUIRED, and easy to miss: hatchling's default file selection derives the
# package directory from the *distribution* name. That worked implicitly while
# the distribution was called "ssh-mcp" (-> src/ssh_mcp), but the distribution
# is now "blc-ssh-mcp", so hatchling looks for src/blc_ssh_mcp, finds nothing,
# and the WHEEL build fails outright with "Unable to determine which files to
# ship inside the wheel" — while the sdist still builds fine, so a partial
# `uv build` looks deceptively healthy. The import package deliberately stays
# `ssh_mcp`; point at it explicitly.
packages = ["src/ssh_mcp"]

[tool.uv]
# Security floors for TRANSITIVE dependencies. These are deliberately NOT in
# [project.dependencies]: ssh-mcp does not import them, and declaring them
# there would assert a dependency edge that does not exist in the published
# wheel's metadata. `constraint-dependencies` is additive — it constrains a
# package only when something else already pulls it in — which is exactly the
# semantics wanted for "if this ends up in the graph, it must be at least X".
constraint-dependencies = [
    # PYSEC-2026-2132 / CVE-2026-7246 — command injection in click.edit():
    # the filename argument was interpolated into a shell string with its
    # quotes unescaped. Reaches us via uvicorn -> click (uvicorn requires
    # click>=7.0); the mcp[cli] -> typer -> click path is gone now that the
    # `[cli]` extra is no longer requested. ssh-mcp never imports click (its
    # CLI parses sys.argv directly), so this is not exploitable here. The
    # floor exists so a future `uv lock` cannot silently regress below it.
    "click>=8.3.3",
    # CVE-2026-69247 (GHSA-g6cj-pr64-35w5) — PKCS#7 EnvelopedData decryption
    # exposed a Bleichenbacher oracle through distinguishable errors and
    # timing (introduced 44.0.0, fixed 50.0.0). Transitive: asyncssh requires
    # cryptography>=48.0.1. ssh-mcp never calls pkcs7_decrypt_*, so this is
    # not exploitable here; the floor keeps a future `uv lock` from
    # regressing below the fix.
    "cryptography>=50.0.1",
]

[tool.ruff.lint]
# Declared explicitly so the lint standard is a property of THIS repo rather
# than of whatever default the installed ruff happens to ship. This is the
# pre-0.16 default set that the codebase has always been held to and is
# currently 100% clean against — no rule is being dropped here. Adopting
# ruff 0.16's wider 413-rule default is a deliberate standard change and is
# deferred: it surfaces ~60 findings (17 in src/, 43 in tests/), several of
# which need judgment rather than an autofix — notably the 9 deliberate broad
# `except Exception` blocks (BLE001), 6 of them in ssh.py backing ExecResult's
# never-raises contract, the rest in healthcheck.py and server.py. Do that as
# its own PR.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# pytest-asyncio >=1.0 warns when this is unset. Every fixture in tests/ is
# function-scoped, so state the default explicitly rather than inherit a
# warning that a future release may turn into an error.
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_reexport = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = "asyncssh.*"
ignore_missing_imports = true
